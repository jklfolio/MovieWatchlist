apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchlist-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: watchlist-service
  template:
    metadata:
      labels:
        app: watchlist-service
    spec:
      containers:
        - name: watchlist-service
          image: kanniga/moviewatchlist-watchlist-service:v1
          ports:
            - containerPort: 8000
          env:
            - name: MOVIE_SERVICE_URL
              value: http://movie-service:8000
---
apiVersion: v1
kind: Service
metadata:
  name: watchlist-service
spec:
  type: LoadBalancer
  selector:
    app: watchlist-service
  ports:
    - port: 8000
      targetPort: 8000
